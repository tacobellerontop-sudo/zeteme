[package]
name = "zeteme"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.37"
wry = "0.57"

# Small, fast release binary: the browser engine is the system's WebView2,
# so the executable itself only carries zeteme's own code.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
