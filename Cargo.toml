[package]
name = "zeteme"
version = "0.2.1"
edition = "2024"
description = "A minimal, keyboard-driven web browser for Windows, in the spirit of qutebrowser"
repository = "https://github.com/tacobellerontop-sudo/zeteme"
readme = "README.md"
keywords = ["browser", "webview", "vim", "qutebrowser"]
categories = ["gui"]

[dependencies]
tao = "0.37"
wry = "0.57"

# Small, fast release binary: the browser engine is the system's WebView2,
# so the executable itself only carries zeteme's own code.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
