<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  body { display: flex; flex-direction: column; box-sizing: border-box; border-top: 1px solid #444;
         font: 13px/20px Consolas, monospace; color: #ddd; }
  ul { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
  li { display: flex; align-items: center; gap: 12px; padding: 0 6px; cursor: default; white-space: nowrap; }
  li.sel { background: #3a3a3a; color: #fff; }
  .name { flex: 2; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .user, .site { flex: 2; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #999; }
  .site { flex: 1; }
  li button { display: none; font: inherit; color: #fff; background: #333; border: 1px solid #555;
              border-radius: 2px; padding: 0 6px; line-height: 16px; }
  li.sel button { display: inline-block; }
  li button:hover { background: #444; }
  .empty { color: #888; }
  .heading { color: #fc3; padding-top: 2px; }
  .bar { display: flex; gap: 8px; padding: 1px 6px; border-top: 1px solid #333; }
  .bar span { white-space: pre; }
  input { all: unset; flex: 1; color: #fff; }
  .hint { color: #777; }
</style>
</head>
<body>
<ul id="list"></ul>
<div class="bar"><span>bw: </span><input id="search" spellcheck="false" placeholder="search">
  <span class="hint">Enter fill · ^U user · ^P password · ^O code · Esc close</span></div>
<script>
  // zeteme's Bitwarden vault, in a webview of its own so pages can't read
  // it. It gets names and usernames only; passwords stay with zeteme, which
  // fills or copies the login whose index is sent back.
  // Each item: [name, username, site, matchesThisPage, hasCode].
  const ITEMS = {{items}};
  const send = (msg) => window.ipc.postMessage(msg);
  const $ = (id) => document.getElementById(id);
  let shown = [];
  let sel = 0;

  function act(action, index) {
    if (index !== undefined) send(`${action} ${index}`);
  }

  function render() {
    const words = $("search").value.toLowerCase().split(/\s+/).filter(Boolean);
    shown = ITEMS.map((item, i) => ({ item, i })).filter(({ item }) => {
      const text = `${item[0]} ${item[1]} ${item[2]}`.toLowerCase();
      return words.every((w) => text.includes(w));
    });
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    const rows = [];
    let lastHere = null;
    shown.forEach(({ item: [name, user, site, here, code], i }, n) => {
      if (here !== lastHere) {
        // Section headings: this site's logins come first.
        const heading = document.createElement("li");
        heading.className = "heading";
        heading.textContent = here ? "This site" : "All logins";
        rows.push(heading);
        lastHere = here;
      }
      const li = document.createElement("li");
      li.className = (n === sel ? "sel " : "") + (here ? "here" : "");
      const cell = (cls, text) => {
        const span = document.createElement("span");
        span.className = cls;
        span.textContent = text;
        li.append(span);
      };
      cell("name", name || site || "(no name)");
      cell("user", user);
      cell("site", site);
      const button = (label, action) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.addEventListener("click", (e) => { e.stopPropagation(); act(action, i); });
        li.append(b);
      };
      button("fill", "fill");
      if (user) button("user", "copy-user");
      button("password", "copy-pass");
      if (code) button("code", "copy-totp");
      li.addEventListener("mousedown", () => { sel = n; render(); });
      li.addEventListener("dblclick", () => act("fill", i));
      rows.push(li);
    });
    if (!rows.length) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = ITEMS.length ? "No match" : "Your vault has no logins";
      rows.push(empty);
    }
    $("list").replaceChildren(...rows);
    const current = $("list").querySelector(".sel");
    if (current) current.scrollIntoView({ block: "nearest" });
    $("search").focus();
  }

  addEventListener("keydown", (e) => {
    const index = shown[sel] && shown[sel].i;
    const key = e.key.toLowerCase();
    let handled = true;
    if (e.key === "Escape") send("cancel");
    else if (e.key === "Enter") act("fill", index);
    else if (e.key === "PageDown") sel = Math.min(sel + 10, shown.length - 1);
    else if (e.key === "PageUp") sel = Math.max(sel - 10, 0);
    else if (e.key === "ArrowDown" || (e.ctrlKey && (key === "j" || key === "n"))) sel = Math.min(sel + 1, shown.length - 1);
    else if (e.key === "ArrowUp" || (e.ctrlKey && key === "k")) sel = Math.max(sel - 1, 0);
    else if (e.ctrlKey && key === "u") act("copy-user", index);
    else if (e.ctrlKey && key === "p") act("copy-pass", index);
    else if (e.ctrlKey && key === "o") act("copy-totp", index);
    else handled = false;
    if (handled) { e.preventDefault(); render(); }
  });
  $("search").addEventListener("input", () => { sel = 0; render(); });
  addEventListener("focus", () => $("search").focus());
  render();
</script>
</body>
</html>
